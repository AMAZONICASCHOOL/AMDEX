<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amazónica RPG — Sistema de Recompensas Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-dark:#0a0a1a;
  --bg-panel:#0f0f2e;
  --bg-card:#141432;
  --bg-hover:#1a1a42;
  --accent-gold:#ffd700;
  --accent-green:#00ff88;
  --accent-blue:#00aaff;
  --accent-purple:#aa44ff;
  --accent-red:#ff4455;
  --accent-orange:#ff8800;
  --text-main:#e8e8ff;
  --text-dim:#8888aa;
  --border:#2a2a5a;
  --border-bright:#4444aa;
  --pixel-shadow: 3px 3px 0px rgba(0,0,0,0.8);
  --glow-gold: 0 0 10px #ffd700, 0 0 20px #ffd700;
  --glow-green: 0 0 10px #00ff88, 0 0 20px #00ff88;
  --glow-blue: 0 0 10px #00aaff, 0 0 20px #00aaff;
  --glow-purple: 0 0 10px #aa44ff, 0 0 20px #aa44ff;
}
html,body,#root{height:100%;width:100%;}
body{
  background-color:var(--bg-dark);
  color:var(--text-main);
  font-family:'VT323',monospace;
  font-size:18px;
  overflow-x:hidden;
  image-rendering:pixelated;
}
/* Pixel art star background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(2px 2px at 50% 50%, rgba(255,215,0,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 5%, rgba(255,255,255,0.8) 0%, transparent 100%),
    linear-gradient(180deg, #0a0a1a 0%, #050518 50%, #0a0a1a 100%);
  z-index:-1;
  pointer-events:none;
}
/* Scrollbar */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#0a0a1a;}
::-webkit-scrollbar-thumb{background:#2a2a6a;image-rendering:pixelated;}

/* PIXEL ART BUTTON */
.btn{
  font-family:'Press Start 2P',monospace;
  font-size:9px;
  padding:10px 16px;
  border:none;
  cursor:pointer;
  position:relative;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:all 0.1s;
  image-rendering:pixelated;
}
.btn::after{
  content:'';
  position:absolute;
  bottom:-4px;
  right:-4px;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  z-index:-1;
}
.btn:active{transform:translate(2px,2px);}
.btn:active::after{display:none;}

.btn-gold{background:var(--accent-gold);color:#000;}
.btn-green{background:var(--accent-green);color:#000;}
.btn-blue{background:var(--accent-blue);color:#000;}
.btn-purple{background:var(--accent-purple);color:#fff;}
.btn-red{background:var(--accent-red);color:#fff;}
.btn-dark{background:var(--bg-hover);color:var(--text-main);border:2px solid var(--border-bright);}
.btn-sm{font-size:7px;padding:6px 10px;}
.btn-xs{font-size:6px;padding:4px 8px;}

/* PIXEL PANEL */
.pixel-panel{
  background:var(--bg-panel);
  border:3px solid var(--border-bright);
  box-shadow:4px 4px 0 #000, inset 1px 1px 0 rgba(255,255,255,0.05);
  padding:20px;
  position:relative;
}
.pixel-panel::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--border-bright),transparent);
}

/* PIXEL CARD */
.pixel-card{
  background:var(--bg-card);
  border:2px solid var(--border);
  padding:15px;
  position:relative;
  transition:all 0.2s;
}
.pixel-card:hover{
  border-color:var(--border-bright);
  transform:translateY(-2px);
  box-shadow:0 4px 0 #000;
}

/* TITLE GLOW */
.title-gold{
  font-family:'Press Start 2P',monospace;
  color:var(--accent-gold);
  text-shadow:var(--glow-gold);
}
.title-green{
  font-family:'Press Start 2P',monospace;
  color:var(--accent-green);
  text-shadow:var(--glow-green);
}
.title-blue{
  font-family:'Press Start 2P',monospace;
  color:var(--accent-blue);
  text-shadow:var(--glow-blue);
}
.title-purple{
  font-family:'Press Start 2P',monospace;
  color:var(--accent-purple);
  text-shadow:var(--glow-purple);
}

/* PROGRESS BAR */
.progress-bar-wrap{
  background:#111130;
  border:2px solid var(--border);
  height:18px;
  position:relative;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  position:relative;
  transition:width 0.5s;
}
.progress-bar-fill::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:40%;
  background:rgba(255,255,255,0.15);
}
.progress-xp .progress-bar-fill{background:linear-gradient(90deg,#aa44ff,#ff88ff);}
.progress-hp .progress-bar-fill{background:linear-gradient(90deg,#ff2244,#ff6688);}

/* INPUT */
.pixel-input{
  background:#0a0a20;
  border:2px solid var(--border-bright);
  color:var(--text-main);
  font-family:'VT323',monospace;
  font-size:20px;
  padding:10px 14px;
  width:100%;
  outline:none;
  transition:border-color 0.2s;
}
.pixel-input:focus{border-color:var(--accent-blue);box-shadow:0 0 8px rgba(0,170,255,0.3);}
.pixel-input::placeholder{color:var(--text-dim);}
.pixel-select{
  background:#0a0a20;
  border:2px solid var(--border-bright);
  color:var(--text-main);
  font-family:'VT323',monospace;
  font-size:18px;
  padding:8px 12px;
  width:100%;
  outline:none;
}

/* BADGE */
.badge{
  font-family:'Press Start 2P',monospace;
  font-size:7px;
  padding:4px 8px;
  display:inline-block;
}
.badge-gold{background:var(--accent-gold);color:#000;}
.badge-green{background:var(--accent-green);color:#000;}
.badge-blue{background:var(--accent-blue);color:#000;}
.badge-purple{background:var(--accent-purple);color:#fff;}
.badge-red{background:var(--accent-red);color:#fff;}
.badge-orange{background:var(--accent-orange);color:#000;}
.badge-gray{background:#333355;color:var(--text-dim);}

/* NAV */
.nav-item{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  padding:12px 16px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:all 0.2s;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text-dim);
}
.nav-item:hover{
  background:var(--bg-hover);
  color:var(--text-main);
  border-left-color:var(--border-bright);
}
.nav-item.active{
  background:var(--bg-hover);
  color:var(--accent-gold);
  border-left-color:var(--accent-gold);
}

/* ANIMATIONS */
@keyframes flicker{
  0%,100%{opacity:1;}
  92%{opacity:1;}
  93%{opacity:0.7;}
  95%{opacity:1;}
  97%{opacity:0.8;}
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
@keyframes scanline{
  0%{transform:translateY(-100%);}
  100%{transform:translateY(100vh);}
}
@keyframes pulse-gold{
  0%,100%{box-shadow:var(--glow-gold);}
  50%{box-shadow:0 0 20px #ffd700, 0 0 40px #ffd700, 0 0 60px #ffd700;}
}
@keyframes levelup{
  0%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.3);opacity:0.8;}
  100%{transform:scale(1);opacity:1;}
}
@keyframes slideIn{
  from{transform:translateX(-20px);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}
@keyframes shimmer{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}

.float-anim{animation:float 3s ease-in-out infinite;}
.pulse-anim{animation:pulse-gold 2s ease-in-out infinite;}
.flicker-anim{animation:flicker 4s linear infinite;}
.slide-in{animation:slideIn 0.3s ease-out;}

/* TIER COLORS */
.tier1{color:#aaffaa;}
.tier2{color:#aaaaff;}
.tier3{color:var(--accent-purple);}
.tier4{color:var(--accent-gold);}

/* CHARACTER SPRITE (pixel art emoji style) */
.char-sprite{
  font-size:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:64px;
  height:64px;
  background:var(--bg-hover);
  border:2px solid var(--border-bright);
  image-rendering:pixelated;
}

/* NOTIFICATION DOT */
.notif-dot{
  width:10px;height:10px;
  background:var(--accent-red);
  border-radius:0;
  display:inline-block;
  animation:pulse-gold 1s infinite;
}

/* MODAL OVERLAY */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-box{
  background:var(--bg-panel);
  border:3px solid var(--accent-gold);
  box-shadow:0 0 30px rgba(255,215,0,0.3),8px 8px 0 #000;
  padding:30px;
  max-width:600px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  position:relative;
}

/* SCANLINE EFFECT */
.scanlines::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:2px;
  background:rgba(255,255,255,0.03);
  z-index:9999;
  pointer-events:none;
  animation:scanline 8s linear infinite;
}

/* LEADERBOARD */
.lb-row{
  display:flex;align-items:center;
  padding:10px 15px;
  border-bottom:1px solid var(--border);
  transition:background 0.2s;
  gap:12px;
}
.lb-row:hover{background:var(--bg-hover);}
.lb-rank{
  font-family:'Press Start 2P',monospace;
  font-size:12px;
  width:30px;
  text-align:center;
}

/* TASK CARD */
.task-card{
  background:var(--bg-card);
  border:2px solid var(--border);
  padding:15px;
  margin-bottom:10px;
  transition:all 0.2s;
}
.task-card.validated{border-color:#00ff88;background:rgba(0,255,136,0.05);}
.task-card.expired{border-color:#ff4455;opacity:0.6;}

/* INVENTORY SLOT */
.inv-slot{
  width:64px;height:64px;
  background:#0a0a20;
  border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.2s;
  position:relative;
  font-size:28px;
}
.inv-slot:hover{border-color:var(--accent-gold);}
.inv-slot.empty{opacity:0.3;}
.inv-slot .qty{
  position:absolute;bottom:2px;right:4px;
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  color:var(--accent-gold);
}

/* STAT BAR */
.stat-row{display:flex;align-items:center;gap:10px;margin:6px 0;}
.stat-label{
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  width:90px;
  color:var(--text-dim);
}
.stat-val{
  font-family:'Press Start 2P',monospace;
  font-size:10px;
  min-width:50px;
  text-align:right;
}

/* COINS DISPLAY */
.coins{
  font-family:'Press Start 2P',monospace;
  font-size:11px;
  color:var(--accent-gold);
  display:flex;align-items:center;gap:6px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{width:200px!important;}
  .main-layout{flex-direction:column;}
}

/* LOGIN SCREEN */
.login-bg{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse at 50% 50%, #0a0a30 0%, #000010 70%);
  position:relative;
  overflow:hidden;
}
.login-bg::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 30px,rgba(0,100,255,0.02) 30px,rgba(0,100,255,0.02) 31px),
    repeating-linear-gradient(90deg,transparent,transparent 30px,rgba(0,100,255,0.02) 30px,rgba(0,100,255,0.02) 31px);
  pointer-events:none;
}

.login-title{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(14px,3vw,22px);
  color:var(--accent-gold);
  text-shadow:var(--glow-gold);
  text-align:center;
  line-height:1.8;
  animation:flicker 5s linear infinite;
}

/* TAG HELPERS */
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-center{justify-content:center;}
.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.w-full{width:100%;}
.text-center{text-align:center;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.p-3{padding:12px;}
.p-4{padding:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;}
.text-gold{color:var(--accent-gold);}
.text-green{color:var(--accent-green);}
.text-blue{color:var(--accent-blue);}
.text-red{color:var(--accent-red);}
.text-dim{color:var(--text-dim);}
.text-sm{font-size:14px;}
.text-xs{font-size:12px;}
.bold{font-family:'Press Start 2P',monospace;}
.rounded{border-radius:0;}
.overflow-auto{overflow:auto;}
.overflow-hidden{overflow:hidden;}
.relative{position:relative;}
.absolute{position:absolute;}
</style>
</head>

function Toast({msg,type,onDone}){
  useEffect(()=>{
    const t=setTimeout(onDone,3000);
    return()=>clearTimeout(t);
  },[]);
  const colors={success:'var(--accent-green)',error:'var(--accent-red)',info:'var(--accent-blue)',gold:'var(--accent-gold)'};
  return(
    <div style={{
      position:'fixed',bottom:'20px',right:'20px',zIndex:9999,
      background:'var(--bg-panel)',border:`3px solid ${colors[type]||colors.info}`,
      padding:'15px 20px',maxWidth:'350px',
      boxShadow:`0 0 20px ${colors[type]||colors.info}`,
      fontFamily:'Press Start 2P',fontSize:'9px',
      animation:'slideIn 0.3s ease-out',
    }}>
      {type==='success'&&'✅ '}{type==='error'&&'❌ '}{type==='gold'&&'🪙 '}{type==='info'&&'ℹ️ '}
      {msg}
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
export default function App(){
  const [currentUser,setCurrentUser]=useState(null);
  const [toast,setToast]=useState(null);
  const [view,setView]=useState('dashboard');

  useEffect(()=>{
    initStorage();
    const sid=LS.get('amz_session');
    if(sid){
      const users=LS.get('amz_users')||[];
      const u=users.find(x=>x.id===sid);
      if(u) setCurrentUser(u);
    }
  },[]);

  const showToast=(msg,type='info')=>{
    setToast({msg,type,id:Date.now()});
  };

  const handleLogin=(user)=>{
    setCurrentUser(user);
    setView('dashboard');
  };

  const handleLogout=()=>{
    LS.del('amz_session');
    setCurrentUser(null);
    setView('dashboard');
  };

  const refreshUser=()=>{
    const users=LS.get('amz_users')||[];
    const u=users.find(x=>x.id===currentUser.id);
    if(u) setCurrentUser(u);
  };

  if(!currentUser) return(
    <>
      <LoginScreen onLogin={handleLogin}/>
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </>
  );

  // Check character selection for students
  if(currentUser.role==='student'&&!currentUser.character){
    const handleCharSelect=(char)=>{
      const users=LS.get('amz_users')||[];
      const idx=users.findIndex(u=>u.id===currentUser.id);
      if(idx>=0){
        users[idx].character=char.id;
        users[idx].stats={fuerza:char.base.fuerza,agilidad:char.base.agilidad,inteligencia:char.base.inteligencia};
        users[idx].xp=0;
        users[idx].level=1;
        users[idx].coins=0;
        users[idx].inventory=[];
        users[idx].bag=null;
        users[idx].tasksCompleted=0;
        LS.set('amz_users',users);
        setCurrentUser(users[idx]);
      }
    };
    return <CharacterSelect user={currentUser} onSelect={handleCharSelect}/>;
  }

  return(
    <>
      {currentUser.role==='admin'&&<AdminDashboard user={currentUser} onLogout={handleLogout} showToast={showToast} refreshUser={refreshUser} view={view} setView={setView}/>}
      {currentUser.role==='teacher'&&<TeacherDashboard user={currentUser} onLogout={handleLogout} showToast={showToast} refreshUser={refreshUser} view={view} setView={setView}/>}
      {currentUser.role==='student'&&<StudentDashboard user={currentUser} onLogout={handleLogout} showToast={showToast} refreshUser={refreshUser} view={view} setView={setView}/>}
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </>
  );
}

  const [tab,setTab]=useState('students');

  const [form,setForm]=useState({name:'',username:'',password:'',course:''});
  const [editId,setEditId]=useState(null);

  const users=LS.get('amz_users')||[];
  const students=users.filter(u=>u.role==='student');
  const teachers=users.filter(u=>u.role==='teacher');

  const saveUser=(role)=>{
    if(!form.name||!form.username||!form.password){showToast('Completa todos los campos','error');return;}
    const allUsers=LS.get('amz_users')||[];
    
    if(editId){
      const idx=allUsers.findIndex(u=>u.id===editId);
      if(idx>=0){
        allUsers[idx]={...allUsers[idx],...form};
        if(role==='student'){
          const sIdx=(LS.get('amz_students')||[]).findIndex(s=>s.id===editId);
          const st=LS.get('amz_students')||[];
          if(sIdx>=0){st[sIdx]={...st[sIdx],...form};LS.set('amz_students',st);}
        }
        if(role==='teacher'){
          const tArr=LS.get('amz_teachers')||[];
          const tIdx=tArr.findIndex(t=>t.id===editId);
          if(tIdx>=0){tArr[tIdx]={...tArr[tIdx],...form};LS.set('amz_teachers',tArr);}
        }
      }
      LS.set('amz_users',allUsers);
      showToast('Usuario actualizado','success');
    } else {
      if(allUsers.find(u=>u.username===form.username)){showToast('Usuario ya existe','error');return;}
      const newUser={
        id:`${role}_${Date.now()}`,role,
        name:form.name,username:form.username,password:form.password,
        course:form.course||'',image:null,
        ...(role==='student'?{
          character:null,level:1,xp:0,coins:0,
          stats:{fuerza:5,agilidad:5,inteligencia:5},
          inventory:[],bag:null,tasksCompleted:0,
          tasksValidated:[],
        }:{courses:form.course?[form.course]:[]}),
      };
      allUsers.push(newUser);
      LS.set('amz_users',allUsers);
      if(role==='student') LS.set('amz_students',[...(LS.get('amz_students')||[]),newUser]);
      if(role==='teacher') LS.set('amz_teachers',[...(LS.get('amz_teachers')||[]),newUser]);
      showToast(`${role==='student'?'Estudiante':'Profesor'} creado exitosamente!`,'success');
    }
    setModal(null);setForm({name:'',username:'',password:'',course:''});setEditId(null);
  };

  const deleteUser=(uid)=>{
    if(!confirm('¿Eliminar este usuario?'))return;
    const allUsers=LS.get('amz_users')||[];
    LS.set('amz_users',allUsers.filter(u=>u.id!==uid));
    LS.set('amz_students',(LS.get('amz_students')||[]).filter(s=>s.id!==uid));
    LS.set('amz_teachers',(LS.get('amz_teachers')||[]).filter(t=>t.id!==uid));
    showToast('Usuario eliminado','info');
  };

  const openEdit=(u)=>{
    setEditId(u.id);
    setForm({name:u.name,username:u.username,password:u.password,course:u.course||''});
    setModal(u.role);
  };

  const changeImage=(uid)=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const allUsers=LS.get('amz_users')||[];
        const idx=allUsers.findIndex(u=>u.id===uid);
        if(idx>=0){allUsers[idx].image=ev.target.result;LS.set('amz_users',allUsers);}
        const st=LS.get('amz_students')||[];
        const si=st.findIndex(s=>s.id===uid);
        if(si>=0){st[si].image=ev.target.result;LS.set('amz_students',st);}
        const te=LS.get('amz_teachers')||[];
        const ti=te.findIndex(t=>t.id===uid);
        if(ti>=0){te[ti].image=ev.target.result;LS.set('amz_teachers',te);}
        showToast('Imagen actualizada','success');
        refreshUser();
      };
      reader.readAsDataURL(file);
    };
    inp.click();
  };

  const list=tab==='students'?students:teachers;

  return(
    <div>
      <div className="flex items-center justify-between mb-4">
        <h1 className="title-gold" style={{fontSize:'14px'}}>👥 GESTIÓN DE USUARIOS</h1>
        <div className="flex gap-2">
          <button className="btn btn-green btn-sm" onClick={()=>{setModal('student');setEditId(null);setForm({name:'',username:'',password:'',course:''});}}>+ ESTUDIANTE</button>
          <button className="btn btn-blue btn-sm" onClick={()=>{setModal('teacher');setEditId(null);setForm({name:'',username:'',password:'',course:''});}}>+ PROFESOR</button>
        </div>
      </div>

      <div className="flex gap-2 mb-4">
        <button className={`btn btn-sm ${tab==='students'?'btn-gold':'btn-dark'}`} onClick={()=>setTab('students')}>⚔️ ESTUDIANTES ({students.length})</button>
        <button className={`btn btn-sm ${tab==='teachers'?'btn-gold':'btn-dark'}`} onClick={()=>setTab('teachers')}>🎓 PROFESORES ({teachers.length})</button>
      </div>

      <div className="pixel-panel">
        {list.length===0?(
          <div style={{textAlign:'center',color:'var(--text-dim)',fontFamily:'VT323',fontSize:'22px',padding:'30px'}}>
            Sin {tab==='students'?'estudiantes':'profesores'} registrados
          </div>
        ):list.map(u=>(
          <div key={u.id} className="flex items-center gap-3 mb-3 pixel-card" style={{marginBottom:'8px'}}>
            <PixelAvatar user={u} size={44}/>
            <div style={{flex:1}}>
              <div style={{fontFamily:'Press Start 2P',fontSize:'9px'}}>{u.name}</div>
              <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)'}}>@{u.username} {u.course&&`• ${u.course}`}</div>
              {u.role==='student'&&<div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--accent-gold)'}}>Nv.{u.level||1} • {u.tasksCompleted||0} tareas • {Math.floor(u.coins||0)} AMZ V</div>}
            </div>
            <div className="flex gap-2">
              <button className="btn btn-dark btn-xs" onClick={()=>changeImage(u.id)}>🖼️</button>
              <button className="btn btn-blue btn-xs" onClick={()=>openEdit(u)}>✏️</button>
              <button className="btn btn-red btn-xs" onClick={()=>deleteUser(u.id)}>🗑️</button>
            </div>
          </div>
        ))}
      </div>

      {modal&&(
        <Modal title={`${editId?'EDITAR':'CREAR'} ${modal==='student'?'ESTUDIANTE':'PROFESOR'}`} onClose={()=>{setModal(null);setEditId(null);}}>
          <div className="flex-col gap-3">
            {[['name','Nombre completo'],['username','Nombre de usuario'],['password','Contraseña'],['course','Curso/Grado']].map(([k,l])=>(
              <div key={k}>
                <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'5px'}}>{l}</label>
                <input className="pixel-input" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={l}
                  type={k==='password'?'password':'text'}/>
              </div>
            ))}
            <button className="btn btn-gold" style={{marginTop:'10px'}} onClick={()=>saveUser(modal)}>
              {editId?'💾 ACTUALIZAR':'➕ CREAR'}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AdminItems({showToast}){
  const [items,setItemsState]=useState(LS.get('amz_items')||DEFAULT_ITEMS);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});

  const save=()=>{
    const all=[...items];
    const idx=all.findIndex(i=>i.id===editing);
    if(idx>=0) all[idx]={...all[idx],...form,price:Number(form.price)||0};
    LS.set('amz_items',all);
    setItemsState(all);
    setEditing(null);
    showToast('Objeto actualizado','success');
  };

  const changeItemImg=(id)=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const all=[...items];
        const idx=all.findIndex(i=>i.id===id);
        if(idx>=0){all[idx].image=ev.target.result;all[idx].emoji=null;}
        LS.set('amz_items',all);setItemsState(all);
        showToast('Imagen cargada','success');
      };
      reader.readAsDataURL(file);
    };inp.click();
  };

  return(
    <div>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'20px'}}>🎒 CATÁLOGO DE OBJETOS</h1>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'12px'}}>
        {items.map(item=>(
          <div key={item.id} className="pixel-card">
            <div style={{fontSize:'36px',textAlign:'center',marginBottom:'8px'}}>
              {item.image?<img src={item.image} style={{width:50,height:50,objectFit:'cover'}}/>:item.emoji}
            </div>
            <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:'var(--accent-gold)',marginBottom:'4px'}}>{item.name}</div>
            <div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)',marginBottom:'6px'}}>{item.desc}</div>
            <div className="flex justify-between items-center mb-2">
              <CoinsDisplay amount={item.price}/>
              <span className={`badge ${item.mode==='single'?'badge-orange':item.mode==='multiple'?'badge-blue':'badge-gray'}`}>
                {item.mode==='single'?'ÚNICO':item.mode==='multiple'?'MÚLTIPLE':'NO-US'}
              </span>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-dark btn-xs" onClick={()=>changeItemImg(item.id)}>🖼️</button>
              <button className="btn btn-blue btn-xs" style={{flex:1}} onClick={()=>{setEditing(item.id);setForm({name:item.name,desc:item.desc,price:item.price,mode:item.mode});}}>✏️ EDITAR</button>
            </div>
          </div>
        ))}
      </div>

      {editing&&(
        <Modal title="EDITAR OBJETO" onClose={()=>setEditing(null)}>
          <div className="flex-col gap-3">
            {[['name','Nombre'],['desc','Descripción'],['price','Precio AMZ V']].map(([k,l])=>(
              <div key={k}>
                <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'5px'}}>{l}</label>
                <input className="pixel-input" value={form[k]||''} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={l}
                  type={k==='price'?'number':'text'}/>
              </div>
            ))}
            <div>
              <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'5px'}}>TIPO DE USO</label>
              <select className="pixel-select" value={form.mode||'single'} onChange={e=>setForm({...form,mode:e.target.value})}>
                <option value="single">Uso Único</option>
                <option value="multiple">Uso Múltiple</option>
                <option value="none">No Utilizable</option>
              </select>
            </div>
            <button className="btn btn-gold" onClick={save}>💾 GUARDAR</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
function AdminEconomy({showToast}){
  const [selected,setSelected]=useState('');
  const [amount,setAmount]=useState('');
  const [op,setOp]=useState('add');
  const users=LS.get('amz_users')||[];
  const students=users.filter(u=>u.role==='student');

  const apply=()=>{
    const n=Number(amount);
    if(!selected||!n||n<=0){showToast('Selecciona estudiante y cantidad válida','error');return;}
    const all=LS.get('amz_users')||[];
    const idx=all.findIndex(u=>u.id===selected);
    if(idx<0)return;
    const prev=all[idx].coins||0;
    all[idx].coins=Math.max(0,op==='add'?prev+n:prev-n);
    LS.set('amz_users',all);
    const st=LS.get('amz_students')||[];
    const si=st.findIndex(s=>s.id===selected);
    if(si>=0){st[si].coins=all[idx].coins;LS.set('amz_students',st);}
    showToast(`${op==='add'?'+':`-`}${n} AMZ V aplicado`,'gold');
    setAmount('');
  };

  return(
    <div>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'20px'}}>🪙 GESTIÓN ECONÓMICA</h1>
      <div className="grid-2">
        <div className="pixel-panel">
          <h3 className="title-blue" style={{fontSize:'10px',marginBottom:'15px'}}>TRANSFERIR AMZ V</h3>
          <div className="mb-3">
            <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'8px'}}>ESTUDIANTE</label>
            <select className="pixel-select" value={selected} onChange={e=>setSelected(e.target.value)}>
              <option value="">Seleccionar...</option>
              {students.map(s=><option key={s.id} value={s.id}>{s.name} — {Math.floor(s.coins||0)} AMZ V</option>)}
            </select>
          </div>
          <div className="mb-3">
            <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'8px'}}>OPERACIÓN</label>
            <div className="flex gap-2">
              <button className={`btn btn-sm ${op==='add'?'btn-green':'btn-dark'}`} onClick={()=>setOp('add')}>➕ AGREGAR</button>
              <button className={`btn btn-sm ${op==='sub'?'btn-red':'btn-dark'}`} onClick={()=>setOp('sub')}>➖ QUITAR</button>
            </div>
          </div>
          <div className="mb-3">
            <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'8px'}}>CANTIDAD AMZ V</label>
            <input className="pixel-input" type="number" min="1" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/>
          </div>
          <button className="btn btn-gold" onClick={apply}>⚡ APLICAR</button>
        </div>

        <div className="pixel-panel">
          <h3 className="title-green" style={{fontSize:'10px',marginBottom:'15px'}}>BALANCE ESTUDIANTES</h3>
          <div style={{maxHeight:'350px',overflowY:'auto'}}>
            {students.sort((a,b)=>(b.coins||0)-(a.coins||0)).map(s=>(
              <div key={s.id} className="flex items-center justify-between mb-2 pixel-card" style={{padding:'8px'}}>
                <div>
                  <div style={{fontFamily:'Press Start 2P',fontSize:'8px'}}>{s.name}</div>
                  <div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)'}}>Nv.{s.level||1}</div>
                </div>
                <CoinsDisplay amount={s.coins||0}/>
              </div>
            ))}
            {students.length===0&&<div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'18px',textAlign:'center'}}>Sin estudiantes</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// TEACHER: TASKS
// ============================================================
function TeacherTasks({user,showToast}){
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({title:'',desc:'',type:'global',course:''});
  const [tasks,setTasksState]=useState(LS.get('amz_tasks')||[]);

  const myTasks=tasks.filter(t=>t.teacherId===user.id&&!isTaskExpired(t));

  const create=()=>{
    if(!form.title||!form.desc){showToast('Completa título y descripción','error');return;}
    const t={
      id:'task_'+Date.now(),
      title:form.title,desc:form.desc,
      type:form.type,course:form.course||'',
      teacherId:user.id,teacherName:user.name,
      createdAt:Date.now(),
      expiresAt:form.type==='course'?Date.now()+(7*24*60*60*1000):null,
      validatedBy:[],
    };
    const all=[...(LS.get('amz_tasks')||[]),t];
    LS.set('amz_tasks',all);
    setTasksState(all);
    setModal(false);setForm({title:'',desc:'',type:'global',course:''});
    showToast('¡Tarea creada exitosamente!','success');
  };

  const deleteTask=(id)=>{
    if(!confirm('¿Eliminar esta tarea?'))return;
    const all=(LS.get('amz_tasks')||[]).filter(t=>t.id!==id);
    LS.set('amz_tasks',all);setTasksState(all);
    showToast('Tarea eliminada','info');
  };

  return(
    <div>
      <div className="flex items-center justify-between mb-4">
        <h1 className="title-blue" style={{fontSize:'14px'}}>📋 MIS TAREAS</h1>
        <button className="btn btn-gold btn-sm" onClick={()=>setModal(true)}>+ CREAR TAREA</button>
      </div>
      {myTasks.length===0&&<div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'22px',textAlign:'center',padding:'40px'}}>No has creado tareas aún</div>}
      {myTasks.map(t=>(
        <div key={t.id} className="task-card mb-3">
          <div className="flex justify-between items-center mb-2">
            <span style={{fontFamily:'Press Start 2P',fontSize:'9px',color:'var(--accent-gold)'}}>{t.title}</span>
            <div className="flex gap-2">
              <span className={`badge ${t.type==='global'?'badge-purple':'badge-blue'}`}>{t.type==='global'?'GLOBAL':'CURSO'}</span>
              <button className="btn btn-red btn-xs" onClick={()=>deleteTask(t.id)}>🗑️</button>
            </div>
          </div>
          <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)',marginBottom:'5px'}}>{t.desc}</div>

// ============================================================
// TEACHER: VALIDATE
// ============================================================
function TeacherValidate({user,showToast}){
  const [selectedTask,setSelectedTask]=useState(null);
  const [selectedStudent,setSelectedStudent]=useState(null);
  const [rewardType,setRewardType]=useState('basic');
  const users=LS.get('amz_users')||[];
  const tasks=(LS.get('amz_tasks')||[]).filter(t=>t.teacherId===user.id&&!isTaskExpired(t));
  const students=users.filter(u=>u.role==='student');

  // Ordenar estudiantes por actividad
  const sortedStudents=[...students].sort((a,b)=>{
    if((b.lastTaskDate||0)!==(a.lastTaskDate||0)) return (b.lastTaskDate||0)-(a.lastTaskDate||0);
    if((b.tasksCompleted||0)!==(a.tasksCompleted||0)) return (b.tasksCompleted||0)-(a.tasksCompleted||0);
    return a.name.localeCompare(b.name);
  });

  const rewardData={
    basic:{coins:1,xp:80,label:'BÁSICA',color:'var(--accent-green)'},
    intermediate:{coins:2,xp:160,label:'INTERMEDIA',color:'var(--accent-blue)'},
    hard:{coins:3,xp:250,label:'DIFÍCIL',color:'var(--accent-purple)'},
  };

  const validate=()=>{
    if(!selectedTask||!selectedStudent){showToast('Selecciona tarea y estudiante','error');return;}
    const task=tasks.find(t=>t.id===selectedTask);
    const student=students.find(s=>s.id===selectedStudent);
    if(!task||!student){showToast('Datos inválidos','error');return;}

    // Check already validated this student for this task
    if(task.validatedBy?.includes(selectedStudent)){
      showToast('Ya validaste a este estudiante en esta tarea','error');return;
    }

    const r=rewardData[rewardType];
    const attrs=['fuerza','agilidad','inteligencia'];
    const randAttr=attrs[Math.floor(Math.random()*3)];

    // Update task
    const allTasks=LS.get('amz_tasks')||[];
    const ti=allTasks.findIndex(t=>t.id===selectedTask);
    if(ti>=0){
      if(!allTasks[ti].validatedBy) allTasks[ti].validatedBy=[];
      allTasks[ti].validatedBy.push(selectedStudent);
      LS.set('amz_tasks',allTasks);
    }

    // Update student - mark as pending reward
    const allUsers=LS.get('amz_users')||[];
    const si=allUsers.findIndex(u=>u.id===selectedStudent);
    if(si>=0){
      if(!allUsers[si].pendingRewards) allUsers[si].pendingRewards=[];
      allUsers[si].pendingRewards.push({
        taskId:selectedTask,taskTitle:task.title,
        coins:r.coins,xp:r.xp,attr:randAttr,attrVal:0.2,
        validatedAt:Date.now(),
      });
      allUsers[si].lastTaskDate=Date.now();
      LS.set('amz_users',allUsers);
      const st=LS.get('amz_students')||[];
      const sst=st.findIndex(s=>s.id===selectedStudent);
      if(sst>=0){st[sst]=allUsers[si];LS.set('amz_students',st);}
    }

    showToast(`✅ ${student.name} validado! Recompensa ${r.label} pendiente`,'success');
    setSelectedStudent(null);
  };

  return(
    <div>
      <h1 className="title-green" style={{fontSize:'14px',marginBottom:'20px'}}>✅ VALIDAR TAREAS</h1>
      <div className="grid-2">
        {/* Selección de tarea */}
        <div className="pixel-panel">
          <h3 className="title-gold" style={{fontSize:'10px',marginBottom:'15px'}}>1. SELECCIONA TAREA</h3>
          {tasks.length===0&&<div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'18px'}}>Sin tareas activas</div>}
          {tasks.map(t=>(
            <div key={t.id}
              className="pixel-card mb-2"
              style={{cursor:'pointer',border:selectedTask===t.id?'2px solid var(--accent-gold)':'2px solid var(--border)',background:selectedTask===t.id?'rgba(255,215,0,0.05)':'var(--bg-card)'}}
              onClick={()=>setSelectedTask(t.id)}
            >
              <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:'var(--accent-gold)',marginBottom:'4px'}}>{t.title}</div>
              <div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)'}}>{t.desc.substring(0,60)}...</div>
              <div style={{fontFamily:'VT323',fontSize:'13px',color:'var(--accent-green)',marginTop:'4px'}}>✅ {t.validatedBy?.length||0} validados</div>
            </div>
          ))}
        </div>

        <div className="flex-col gap-4">
          {/* Tipo de recompensa */}
          <div className="pixel-panel">
            <h3 className="title-gold" style={{fontSize:'10px',marginBottom:'15px'}}>2. RECOMPENSA</h3>
            {Object.entries(rewardData).map(([k,r])=>(
              <div key={k}
                className="pixel-card mb-2"
                style={{cursor:'pointer',border:rewardType===k?`2px solid ${r.color}`:'2px solid var(--border)',background:rewardType===k?`rgba(0,0,0,0.3)`:'var(--bg-card)'}}
                onClick={()=>setRewardType(k)}
              >
                <div className="flex justify-between items-center">
                  <span style={{fontFamily:'Press Start 2P',fontSize:'8px',color:r.color}}>{r.label}</span>
                  <span style={{fontFamily:'VT323',fontSize:'16px'}}>🪙{r.coins} + {r.xp}XP</span>
                </div>
              </div>
            ))}
          </div>

          {/* Selección de estudiante */}
          <div className="pixel-panel" style={{flex:1}}>
            <h3 className="title-gold" style={{fontSize:'10px',marginBottom:'15px'}}>3. ESTUDIANTE</h3>
            <div style={{maxHeight:'250px',overflowY:'auto'}}>
              {sortedStudents.map(s=>{
                const task=tasks.find(t=>t.id===selectedTask);
                const alreadyValidated=task?.validatedBy?.includes(s.id);
                return(
                  <div key={s.id}
                    className="flex items-center gap-2 pixel-card mb-2"
                    style={{
                      cursor:alreadyValidated?'not-allowed':'pointer',
                      border:selectedStudent===s.id?'2px solid var(--accent-green)':alreadyValidated?'2px solid var(--accent-green)':'2px solid var(--border)',
                      opacity:alreadyValidated?0.6:1,
                    }}
                    onClick={()=>{if(!alreadyValidated)setSelectedStudent(s.id);}}
                  >
                    <PixelAvatar user={s} size={32}/>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'Press Start 2P',fontSize:'7px'}}>{s.name}</div>
                      <div style={{fontFamily:'VT323',fontSize:'13px',color:'var(--text-dim)'}}>{s.tasksCompleted||0} tareas</div>
                    </div>
                    {alreadyValidated&&<span style={{color:'var(--accent-green)',fontSize:'12px'}}>✅</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>

      {selectedTask&&selectedStudent&&(
        <div className="pixel-panel mt-4 text-center" style={{borderColor:'var(--accent-gold)'}}>
          <div style={{fontFamily:'VT323',fontSize:'22px',color:'var(--accent-gold)',marginBottom:'10px'}}>
            ⚡ Validar "{tasks.find(t=>t.id===selectedTask)?.title}" para {students.find(s=>s.id===selectedStudent)?.name}
          </div>
          <button className="btn btn-gold" style={{fontSize:'11px',padding:'14px 30px'}} onClick={validate}>
            ✅ CONFIRMAR VALIDACIÓN
          </button>
        </div>
      )}
    </div>
  );
}

function TeacherNotifs({user,showToast}){
  const [notifs,setNotifs]=useState((LS.get('amz_notifications')||[]).filter(n=>n.teacherId===user.id));

  const markRead=(id)=>{
    const all=LS.get('amz_notifications')||[];
    const idx=all.findIndex(n=>n.id===id);
    if(idx>=0){all[idx].read=true;LS.set('amz_notifications',all);}
    setNotifs(all.filter(n=>n.teacherId===user.id));
  };

  const markAllRead=()=>{
    const all=LS.get('amz_notifications')||[];
    all.forEach(n=>{if(n.teacherId===user.id)n.read=true;});
    LS.set('amz_notifications',all);
    setNotifs(all.filter(n=>n.teacherId===user.id));
    showToast('Todas marcadas como leídas','info');
  };

  return(
    <div>
      <div className="flex justify-between items-center mb-4">
        <h1 className="title-blue" style={{fontSize:'14px'}}>🔔 NOTIFICACIONES</h1>
        {notifs.some(n=>!n.read)&&<button className="btn btn-dark btn-sm" onClick={markAllRead}>✓ LEER TODAS</button>}
      </div>
      {notifs.length===0&&<div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'22px',textAlign:'center',padding:'40px'}}>Sin notificaciones</div>}
      {[...notifs].reverse().map(n=>(
        <div key={n.id} className="pixel-card mb-3" style={{border:n.read?'2px solid var(--border)':`2px solid var(--accent-blue)`,background:n.read?'var(--bg-card)':'rgba(0,170,255,0.05)'}}>
          <div className="flex justify-between items-center mb-2">
            <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:'var(--accent-blue)'}}>
              {n.itemEmoji} OBJETO USADO
            </div>
            <div className="flex gap-2 items-center">
              <span style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)'}}>{new Date(n.date).toLocaleString()}</span>
              {!n.read&&<button className="btn btn-dark btn-xs" onClick={()=>markRead(n.id)}>✓</button>}
            </div>
          </div>
          <div style={{fontFamily:'VT323',fontSize:'18px'}}>
            <strong style={{color:'var(--accent-gold)'}}>{n.studentName}</strong> usó{' '}
            <strong style={{color:'var(--accent-purple)'}}>{n.itemName}</strong>
          </div>
        </div>
      ))}
    </div>
  );
}

function TeacherProfile({user,showToast,refreshUser}){
  const changeImage=()=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const all=LS.get('amz_users')||[];
        const idx=all.findIndex(u=>u.id===user.id);
        if(idx>=0){all[idx].image=ev.target.result;LS.set('amz_users',all);}
        const te=LS.get('amz_teachers')||[];
        const ti=te.findIndex(t=>t.id===user.id);
        if(ti>=0){te[ti].image=ev.target.result;LS.set('amz_teachers',te);}
        refreshUser();showToast('Imagen actualizada','success');
      };
      reader.readAsDataURL(file);
    };inp.click();
  };
  const myTasks=(LS.get('amz_tasks')||[]).filter(t=>t.teacherId===user.id&&!isTaskExpired(t));
  return(
    <div style={{maxWidth:'500px'}}>
      <h1 className="title-blue" style={{fontSize:'14px',marginBottom:'20px'}}>🎓 MI PERFIL</h1>
      <div className="pixel-panel text-center mb-4">
        <div style={{marginBottom:'15px'}}><PixelAvatar user={user} size={80}/></div>
        <div style={{fontFamily:'Press Start 2P',fontSize:'12px',color:'var(--accent-blue)',marginBottom:'5px'}}>{user.name}</div>
        <div style={{fontFamily:'VT323',fontSize:'18px',color:'var(--text-dim)',marginBottom:'5px'}}>@{user.username}</div>
        {user.course&&<span className="badge badge-blue">{user.course}</span>}
        <div className="mt-4"><button className="btn btn-blue btn-sm" onClick={changeImage}>🖼️ CAMBIAR IMAGEN</button></div>
      </div>
      <StatCard icon="📋" label="TAREAS ACTIVAS" value={myTasks.length} color="var(--accent-blue)"/>
    </div>
  );
}

// STUDENT: TASKS
// ============================================================
function StudentTasks({user,showToast,refreshUser}){
  const [tab,setTab]=useState('all');
  const freshUser=(LS.get('amz_users')||[]).find(u=>u.id===user.id)||user;
  const tasks=(LS.get('amz_tasks')||[]).filter(t=>!isTaskExpired(t));
  const globalTasks=tasks.filter(t=>t.type==='global');
  const courseTasks=tasks.filter(t=>t.type==='course');

  const claimReward=(rewardIdx)=>{
    const all=LS.get('amz_users')||[];
    const idx=all.findIndex(u=>u.id===user.id);
    if(idx<0)return;
    const reward=all[idx].pendingRewards[rewardIdx];
    if(!reward)return;

    // Apply reward
    all[idx].coins=(all[idx].coins||0)+reward.coins;
    all[idx].xp=(all[idx].xp||0)+reward.xp;
    all[idx].tasksCompleted=(all[idx].tasksCompleted||0)+1;
    if(!all[idx].stats) all[idx].stats={fuerza:5,agilidad:5,inteligencia:5};
    all[idx].stats[reward.attr]=(all[idx].stats[reward.attr]||5)+0.2;

    // Level up check
    let level=all[idx].level||1;
    let xp=all[idx].xp;
    while(level<100&&xp>=XP_FOR_LEVEL(level)){
      xp-=XP_FOR_LEVEL(level);
      level++;
    }
    all[idx].level=level;
    all[idx].xp=xp;

    // Remove claimed reward
    all[idx].pendingRewards=all[idx].pendingRewards.filter((_,i)=>i!==rewardIdx);

    LS.set('amz_users',all);
    const st=LS.get('amz_students')||[];
    const si=st.findIndex(s=>s.id===user.id);
    if(si>=0){st[si]=all[idx];LS.set('amz_students',st);}

    showToast(`🎉 +${reward.coins} AMZ V, +${reward.xp} XP, +0.2 ${reward.attr}`,'gold');
    refreshUser();
  };

  const pending=freshUser.pendingRewards||[];

  const displayTasks=tab==='all'?tasks:tab==='global'?globalTasks:courseTasks;

  return(
    <div>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'20px'}}>📋 MIS TAREAS</h1>

      {/* Pending rewards */}
      {pending.length>0&&(
        <div className="pixel-panel mb-4" style={{borderColor:'var(--accent-gold)',boxShadow:'var(--glow-gold)'}}>
          <h3 style={{fontFamily:'Press Start 2P',fontSize:'9px',color:'var(--accent-gold)',marginBottom:'12px'}}>⚡ RECOMPENSAS PENDIENTES ({pending.length})</h3>
          {pending.map((r,i)=>(
            <div key={i} className="flex items-center justify-between pixel-card mb-2" style={{borderColor:'var(--accent-gold)',background:'rgba(255,215,0,0.05)'}}>
              <div>
                <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:'var(--accent-gold)'}}>{r.taskTitle}</div>
                <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)'}}>🪙{r.coins} + {r.xp}XP + +0.2 {r.attr}</div>
              </div>
              <button className="btn btn-gold btn-sm" onClick={()=>claimReward(i)}>⚡ RECLAMAR</button>
            </div>
          ))}
        </div>
      )}

      <div className="flex gap-2 mb-4">
        {[['all','📋 TODAS'],['global','🌍 GLOBALES'],['course','📚 CURSO']].map(([k,l])=>(
          <button key={k} className={`btn btn-sm ${tab===k?'btn-gold':'btn-dark'}`} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      {displayTasks.length===0&&<div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'22px',textAlign:'center',padding:'40px'}}>Sin tareas disponibles</div>}
      {displayTasks.map(t=>{
        const isValidated=t.validatedBy?.includes(user.id);
        const hasPending=pending.find(r=>r.taskId===t.id);
        return(
          <div key={t.id} className={`task-card mb-3 ${isValidated?'validated':''}`}>
            <div className="flex justify-between items-center mb-2">
              <span style={{fontFamily:'Press Start 2P',fontSize:'9px',color:isValidated?'var(--accent-green)':'var(--accent-gold)'}}>{t.title}</span>
              <div className="flex gap-2 items-center">
                <span className={`badge ${t.type==='global'?'badge-purple':'badge-blue'}`}>{t.type==='global'?'GLOBAL':'CURSO'}</span>
                {isValidated&&<span className="badge badge-green">✅ VALIDADA</span>}
              </div>
            </div>
            <div style={{fontFamily:'VT323',fontSize:'17px',color:'var(--text-dim)',marginBottom:'8px'}}>{t.desc}</div>
            <div style={{fontFamily:'VT323',fontSize:'15px',color:'var(--text-dim)',marginBottom:'5px'}}>
              🎓 Prof. {t.teacherName}
            </div>
            {t.expiresAt&&<TimeLeft expiresAt={t.expiresAt}/>}
            {isValidated&&(
              <div style={{
                marginTop:'10px',padding:'10px',
                background:'rgba(0,255,136,0.05)',
                border:'1px solid var(--accent-green)',
                fontFamily:'Press Start 2P',fontSize:'8px',
                color:'var(--accent-green)',
              }}>
                {hasPending?'⏳ RECOMPENSA PENDIENTE DE RECLAMAR':'✅ RECOMPENSA YA RECLAMADA'}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// STUDENT: SHOP
// ============================================================
function StudentShop({user,showToast,refreshUser}){
  const [items,setItemsList]=useState(LS.get('amz_items')||DEFAULT_ITEMS);
  const freshUser=(LS.get('amz_users')||[]).find(u=>u.id===user.id)||user;
  const bags=DEFAULT_BAGS;

  const currentBag=bags.find(b=>b.id===freshUser.bag);
  const invCount=(freshUser.inventory||[]).reduce((a,i)=>a+(i.qty||1),0);
  const slotsUsed=invCount;
  const slotsMax=currentBag?.slots||0;

  const buyItem=(item)=>{
    if(!freshUser.bag){showToast('¡Necesitas una mochila primero!','error');return;}
    if(slotsUsed>=slotsMax){showToast('¡Mochila llena!','error');return;}
    if((freshUser.coins||0)<item.price){showToast('No tienes suficientes AMZ V','error');return;}

    const all=LS.get('amz_users')||[];
    const idx=all.findIndex(u=>u.id===freshUser.id);
    if(idx<0)return;
    all[idx].coins=(all[idx].coins||0)-item.price;
    if(!all[idx].inventory) all[idx].inventory=[];
    const existing=all[idx].inventory.find(i=>i.itemId===item.id);
    if(existing) existing.qty=(existing.qty||1)+1;
    else all[idx].inventory.push({itemId:item.id,qty:1,usedAt:null});
    LS.set('amz_users',all);
    const st=LS.get('amz_students')||[];
    const si=st.findIndex(s=>s.id===freshUser.id);
    if(si>=0){st[si]=all[idx];LS.set('amz_students',st);}
    showToast(`Compraste ${item.emoji} ${item.name}`,'gold');
    refreshUser();
  };

  const buyBag=(bag)=>{
    if(bag.level===1){
      // First bag is free
      if(freshUser.bag){showToast('Ya tienes una mochila','error');return;}
    } else {
      if((freshUser.coins||0)<bag.price){showToast('No tienes suficientes AMZ V','error');return;}
      const currentLevel=bags.find(b=>b.id===freshUser.bag)?.level||0;
      if(bag.level<=currentLevel){showToast('Ya tienes una mochila mejor','error');return;}
    }
    const all=LS.get('amz_users')||[];
    const idx=all.findIndex(u=>u.id===freshUser.id);
    if(idx<0)return;
    if(bag.level>1) all[idx].coins=(all[idx].coins||0)-bag.price;
    all[idx].bag=bag.id;
    LS.set('amz_users',all);
    const st=LS.get('amz_students')||[];
    const si=st.findIndex(s=>s.id===freshUser.id);
    if(si>=0){st[si]=all[idx];LS.set('amz_students',st);}
    showToast(`${bag.emoji} ${bag.name} equipada!`,'success');
    refreshUser();
  };

  return(
    <div>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'10px'}}>🛒 TIENDA AMZ</h1>
      <div className="flex justify-between items-center mb-4">
        <CoinsDisplay amount={freshUser.coins||0}/>
        <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)'}}>
          🎒 {slotsUsed}/{slotsMax} slots usados
        </div>
      </div>

      {/* Mochilas */}
      <div className="pixel-panel mb-4">
        <h3 className="title-green" style={{fontSize:'10px',marginBottom:'15px'}}>🎒 MOCHILAS</h3>
        <div className="grid-3">
          {bags.map(bag=>{
            const owned=freshUser.bag===bag.id;
            const currentLevel=bags.find(b=>b.id===freshUser.bag)?.level||0;
            const canBuy=bag.level===1&&!freshUser.bag||(bag.level>currentLevel&&(freshUser.coins||0)>=bag.price);
            return(
              <div key={bag.id} className="pixel-card text-center" style={{border:owned?'2px solid var(--accent-gold)':'2px solid var(--border)'}}>
                <div style={{fontSize:'36px',marginBottom:'8px'}}>{bag.emoji}</div>
                <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:owned?'var(--accent-gold)':'var(--text-main)',marginBottom:'4px'}}>{bag.name}</div>
                <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)',marginBottom:'8px'}}>{bag.slots} slots</div>
                {owned?<span className="badge badge-gold">EQUIPADA</span>:(
                  <button className={`btn btn-sm ${canBuy?'btn-gold':'btn-dark'}`}
                    disabled={!canBuy}
                    onClick={()=>buyBag(bag)}>
                    {bag.level===1?'GRATIS':bag.price+' AMZ V'}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Items */}
      <h3 className="title-gold" style={{fontSize:'10px',marginBottom:'15px'}}>⚔️ OBJETOS</h3>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'12px'}}>
        {items.map(item=>{
          const canAfford=(freshUser.coins||0)>=item.price;
          const hasBag=!!freshUser.bag;
          const hasSpace=slotsUsed<slotsMax;
          return(
            <div key={item.id} className="pixel-card" style={{opacity:(!hasBag||!hasSpace)?0.6:1}}>
              <div style={{fontSize:'36px',textAlign:'center',marginBottom:'8px'}}>
                {item.image?<img src={item.image} style={{width:50,height:50,objectFit:'cover'}}/>:item.emoji}
              </div>
              <div style={{fontFamily:'Press Start 2P',fontSize:'8px',color:'var(--accent-gold)',marginBottom:'4px'}}>{item.name}</div>
              <div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)',marginBottom:'6px'}}>{item.desc}</div>
              <div className="flex justify-between items-center mb-2">
                <CoinsDisplay amount={item.price}/>
                <span className={`badge ${item.mode==='single'?'badge-orange':item.mode==='multiple'?'badge-blue':'badge-gray'}`} style={{fontSize:'6px'}}>
                  {item.mode==='single'?'ÚNICO':item.mode==='multiple'?'MÚLT':'N/A'}
                </span>
              </div>
              <button
                className={`btn btn-sm w-full ${canAfford&&hasBag&&hasSpace?'btn-gold':'btn-dark'}`}
                style={{width:'100%'}}
                disabled={!canAfford||!hasBag||!hasSpace}
                onClick={()=>buyItem(item)}
              >
                {!hasBag?'NECESITAS MOCHILA':!hasSpace?'MOCHILA LLENA':!canAfford?'SIN FONDOS':'🛒 COMPRAR'}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// STUDENT: INVENTORY
// ============================================================
function StudentInventory({user,showToast,refreshUser}){
  const [useModal,setUseModal]=useState(null);
  const [selectedTeacher,setSelectedTeacher]=useState('');
  const freshUser=(LS.get('amz_users')||[]).find(u=>u.id===user.id)||user;
  const allItems=LS.get('amz_items')||DEFAULT_ITEMS;
  const teachers=(LS.get('amz_users')||[]).filter(u=>u.role==='teacher');
  const bags=DEFAULT_BAGS;
  const currentBag=bags.find(b=>b.id===freshUser.bag);
  const inv=freshUser.inventory||[];

  const useItem=()=>{
    if(!selectedTeacher){showToast('Selecciona un profesor','error');return;}
    const item=allItems.find(i=>i.id===useModal.itemId);
    if(!item)return;
    if(item.mode==='none'){showToast('Este objeto no se puede usar','error');return;}

    const all=LS.get('amz_users')||[];
    const idx=all.findIndex(u=>u.id===freshUser.id);
    if(idx<0)return;

    if(item.mode==='single'){
      const invIdx=all[idx].inventory.findIndex(i=>i.itemId===item.id);
      if(invIdx>=0){
        all[idx].inventory[invIdx].qty=(all[idx].inventory[invIdx].qty||1)-1;
        if(all[idx].inventory[invIdx].qty<=0) all[idx].inventory.splice(invIdx,1);
      }
    }
    LS.set('amz_users',all);

    // Send notification
    const notifs=LS.get('amz_notifications')||[];
    notifs.push({
      id:'notif_'+Date.now(),
      teacherId:selectedTeacher,
      studentName:freshUser.name,
      studentId:freshUser.id,
      itemName:item.name,
      itemEmoji:item.emoji||'🎁',
      date:Date.now(),
      read:false,
    });
    LS.set('amz_notifications',notifs);

    const st=LS.get('amz_students')||[];
    const si=st.findIndex(s=>s.id===freshUser.id);
    if(si>=0){st[si]=all[idx];LS.set('amz_students',st);}

    showToast(`Usaste ${item.emoji} ${item.name}!`,'success');
    setUseModal(null);setSelectedTeacher('');
    refreshUser();
  };

  return(
    <div>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'10px'}}>🎒 INVENTARIO</h1>
      {currentBag?(
        <div style={{fontFamily:'VT323',fontSize:'18px',color:'var(--text-dim)',marginBottom:'20px'}}>
          {currentBag.emoji} {currentBag.name} — {inv.reduce((a,i)=>a+(i.qty||1),0)}/{currentBag.slots} slots
        </div>
      ):(
        <div style={{fontFamily:'Press Start 2P',fontSize:'9px',color:'var(--accent-red)',marginBottom:'20px'}}>⚠️ Sin mochila equipada</div>
      )}

      {inv.length===0?(
        <div style={{color:'var(--text-dim)',fontFamily:'VT323',fontSize:'22px',textAlign:'center',padding:'40px'}}>
          Inventario vacío — ¡Ve a la tienda!
        </div>
      ):(
        <div style={{display:'flex',flexWrap:'wrap',gap:'10px'}}>
          {inv.map((entry,i)=>{
            const item=allItems.find(it=>it.id===entry.itemId);
            if(!item)return null;
            return(
              <div key={i} className="inv-slot" style={{width:'80px',height:'80px',flexDirection:'column',gap:'4px'}}
                onClick={()=>setUseModal(entry)}>
                <div style={{fontSize:'28px'}}>
                  {item.image?<img src={item.image} style={{width:32,height:32,objectFit:'cover'}}/>:item.emoji}
                </div>
                <div style={{fontFamily:'Press Start 2P',fontSize:'6px',color:'var(--text-dim)',textAlign:'center',lineHeight:'1.2'}}>{item.name.substring(0,8)}</div>
                <div className="qty">x{entry.qty||1}</div>
              </div>
            );
          })}
        </div>
      )}

      {useModal&&(()=>{
        const item=allItems.find(i=>i.id===useModal.itemId);
        return(
          <Modal title={`USAR OBJETO`} onClose={()=>{setUseModal(null);setSelectedTeacher('');}}>
            <div className="text-center mb-4">
              <div style={{fontSize:'50px',marginBottom:'10px'}}>{item?.image?<img src={item.image} style={{width:64,height:64,objectFit:'cover'}}/>:item?.emoji}</div>
              <div style={{fontFamily:'Press Start 2P',fontSize:'10px',color:'var(--accent-gold)',marginBottom:'5px'}}>{item?.name}</div>
              <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)',marginBottom:'5px'}}>{item?.desc}</div>
              <span className={`badge ${item?.mode==='none'?'badge-gray':item?.mode==='single'?'badge-orange':'badge-blue'}`}>
                {item?.mode==='single'?'SE CONSUMIRÁ':item?.mode==='multiple'?'PERMANECE EN INVENTARIO':'NO UTILIZABLE'}
              </span>
            </div>
            {item?.mode!=='none'&&(
              <>
                <div className="mb-3">
                  <label style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',display:'block',marginBottom:'8px'}}>NOTIFICAR A PROFESOR</label>
                  <select className="pixel-select" value={selectedTeacher} onChange={e=>setSelectedTeacher(e.target.value)}>
                    <option value="">Seleccionar profesor...</option>
                    {teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <button className="btn btn-gold w-full" style={{width:'100%'}} onClick={useItem}>⚡ USAR OBJETO</button>
              </>
            )}
          </Modal>
        );
      })()}
    </div>
  );
}

function StudentProfile({user,showToast,refreshUser}){
  const freshUser=(LS.get('amz_users')||[]).find(u=>u.id===user.id)||user;
  const char=CHARACTERS.find(c=>c.id===freshUser.character);
  const tier=getTier(freshUser.level||1);

  const changeImage=()=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const all=LS.get('amz_users')||[];
        const idx=all.findIndex(u=>u.id===freshUser.id);
        if(idx>=0){all[idx].image=ev.target.result;LS.set('amz_users',all);}
        const st=LS.get('amz_students')||[];
        const si=st.findIndex(s=>s.id===freshUser.id);
        if(si>=0){st[si].image=ev.target.result;LS.set('amz_students',st);}
        refreshUser();showToast('Imagen actualizada','success');
      };
      reader.readAsDataURL(file);
    };inp.click();
  };

  const xpNeeded=XP_FOR_LEVEL(freshUser.level||1);

  return(
    <div style={{maxWidth:'600px'}}>
      <h1 className="title-gold" style={{fontSize:'14px',marginBottom:'20px'}}>⚔️ MI PERFIL</h1>
      
      <div className="pixel-panel mb-4" style={{borderColor:tier.color}}>

          <div style={{position:'relative'}}>
            <PixelAvatar user={freshUser} size={80}/>
            <button className="btn btn-dark btn-xs" style={{position:'absolute',bottom:-8,right:-8,fontSize:'8px'}} onClick={changeImage}>🖼️</button>
          </div>
          <div>
            <div style={{fontFamily:'Press Start 2P',fontSize:'12px',color:tier.color,marginBottom:'5px'}}>{freshUser.name}</div>
            <div style={{fontFamily:'VT323',fontSize:'18px',color:'var(--text-dim)',marginBottom:'5px'}}>@{freshUser.username}</div>
            <span className="badge" style={{background:tier.color,color:'#000',fontSize:'7px'}}>{tier.label}</span>
          </div>
        </div>

        <XPBar current={freshUser.xp||0} total={xpNeeded} level={freshUser.level||1}/>

        <div className="grid-3 mt-4 mb-4">
          {[
            {label:'⚔️ FUERZA',val:freshUser.stats?.fuerza||5,color:'#ff6644'},
            {label:'💨 AGILIDAD',val:freshUser.stats?.agilidad||5,color:'#44aaff'},
            {label:'🔮 INTELIGENCIA',val:freshUser.stats?.inteligencia||5,color:'#aa44ff'},
          ].map(s=>(

              <div style={{fontFamily:'Press Start 2P',fontSize:'7px',color:s.color,marginBottom:'5px'}}>{s.label}</div>
              <div style={{fontFamily:'Press Start 2P',fontSize:'14px',color:s.color}}>{s.val.toFixed(1)}</div>
            </div>
          ))}
        </div>

        <div className="grid-2">
          <div style={{textAlign:'center',padding:'10px',background:'rgba(0,0,0,0.3)',border:'1px solid var(--border)'}}>
            <div style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',marginBottom:'5px'}}>TAREAS COMPLETADAS</div>
            <div style={{fontFamily:'Press Start 2P',fontSize:'16px',color:'var(--accent-green)'}}>{freshUser.tasksCompleted||0}</div>
          </div>
          <div style={{textAlign:'center',padding:'10px',background:'rgba(0,0,0,0.3)',border:'1px solid var(--border)'}}>
            <div style={{fontFamily:'Press Start 2P',fontSize:'7px',color:'var(--text-dim)',marginBottom:'5px'}}>AMZ V</div>
            <div style={{fontFamily:'Press Start 2P',fontSize:'16px',color:'var(--accent-gold)'}}>{Math.floor(freshUser.coins||0)}</div>
          </div>
        </div>
      </div>

      {char&&(
        <div className="pixel-panel">
          <h3 className="title-gold" style={{fontSize:'10px',marginBottom:'15px'}}>🧙 PERSONAJE</h3>
          <div className="flex items-center gap-4">
            <div style={{fontSize:'50px'}}>{char.emoji}</div>
            <div>
              <div style={{fontFamily:'Press Start 2P',fontSize:'10px',color:char.color}}>{char.name}</div>
              <div style={{fontFamily:'VT323',fontSize:'18px',color:'var(--text-dim)'}}>{char.type} — {char.desc}</div>
            </div>
          </div>
        </div>
      )}

      {/* Tier benefits */}
      <div className="pixel-panel mt-4" style={{borderColor:tier.color}}>
        <h3 style={{fontFamily:'Press Start 2P',fontSize:'9px',color:tier.color,marginBottom:'12px'}}>🎁 {tier.label}</h3>
        {getTierBenefits(tier.tier).map((b,i)=>(
          <div key={i} style={{fontFamily:'VT323',fontSize:'18px',color:'var(--text-main)',display:'flex',gap:'8px',marginBottom:'5px'}}>
            <span style={{color:tier.color}}>▶</span>{b}
          </div>

  );

  const users=LS.get('amz_users')||[];

      if((b.level||1)!==(a.level||1)) return (b.level||1)-(a.level||1);

  const medals=['🥇','🥈','🥉'];

  return(
    <div>
      <div className="flex items-center gap-3 mb-4">

                <div style={{fontFamily:'Press Start 2P',fontSize:'9px'}}>{s.name}</div>
                <div style={{fontFamily:'VT323',fontSize:'15px',color:tier.color}}>{tier.label.split('—')[0].trim()}</div>

            </div>
          );
        })}

// ============================================================
// SHARED UTILS
// ============================================================
function isTaskExpired(task){
  if(!task.expiresAt) return false;
  return Date.now()>task.expiresAt;
}

function TimeLeft({expiresAt}){
  const [left,setLeft]=useState('');
  useEffect(()=>{
    const calc=()=>{
      const ms=expiresAt-Date.now();
      if(ms<=0){setLeft('EXPIRADA');return;}
      const d=Math.floor(ms/86400000);
      const h=Math.floor((ms%86400000)/3600000);
      const m=Math.floor((ms%3600000)/60000);
      setLeft(`${d}d ${h}h ${m}m`);
    };
    calc();
    const t=setInterval(calc,60000);
    return()=>clearInterval(t);
  },[expiresAt]);
  const urgent=(expiresAt-Date.now())<86400000;
  return(
    <div style={{fontFamily:'Press Start 2P',fontSize:'7px',color:urgent?'var(--accent-red)':'var(--text-dim)',marginTop:'5px'}}>
      ⏰ {left}
    </div>
  );
}

function TaskCardView({task}){
  return(
    <div className="task-card mb-3">
      <div className="flex justify-between items-center mb-2">
        <span style={{fontFamily:'Press Start 2P',fontSize:'9px',color:'var(--accent-gold)'}}>{task.title}</span>
        <span className={`badge ${task.type==='global'?'badge-purple':'badge-blue'}`}>{task.type==='global'?'GLOBAL':'CURSO'}</span>
      </div>
      <div style={{fontFamily:'VT323',fontSize:'16px',color:'var(--text-dim)',marginBottom:'5px'}}>{task.desc}</div>
      <div style={{fontFamily:'VT323',fontSize:'14px',color:'var(--text-dim)'}}>{task.teacherName&&`🎓 ${task.teacherName}`}</div>
      {task.expiresAt&&<TimeLeft expiresAt={task.expiresAt}/>}
    </div>
  );
}
