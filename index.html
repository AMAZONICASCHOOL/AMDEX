<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMDEX - Plataforma Escolar RPG Pixel Art</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            font-family: 'Press Start 2P', cursive;
        }
        
        html, body, #root {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        .pixel-container {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        @keyframes pixelFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .pixel-float {
            animation: pixelFloat 2s ease-in-out infinite;
        }
        
        @keyframes pixelPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pixel-pulse {
            animation: pixelPulse 0.5s ease-in-out infinite;
        }
        
        .retro-border {
            border: 4px solid #2d1810;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3);
        }
        
        .retro-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            border: 3px solid #2d1810;
            color: #FFEB3B;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.05s;
            font-size: 0.75rem;
        }
        
        .retro-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0px #2d1810;
        }
        
        .retro-button:active {
            transform: translate(0px, 0px);
        }
        
        .retro-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pixel-text {
            color: #2d1810;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
        }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        .stat-bar {
            background: linear-gradient(90deg, #8B4513, #D2691E);
            border: 2px solid #2d1810;
            height: 20px;
        }
        
        .xp-bar {
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border: 2px solid #2d1810;
            height: 16px;
        }
        
        .task-completed {
            background-color: #C8E6C9;
            border-left: 4px solid #4CAF50;
        }
        
        .task-pending {
            background-color: #FFE0B2;
            border-left: 4px solid #FF9800;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 to-yellow-100 overflow-hidden">
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
