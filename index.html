<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazónica RPG — Sistema de Recompensas Escolar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a1a;
      --bg-panel: #0f0f2e;
      --bg-card: #141432;
      --bg-hover: #1a1a42;
      --accent-gold: #ffd700;
      --accent-green: #00ff88;
      --accent-blue: #00aaff;
      --accent-purple: #aa44ff;
      --accent-red: #ff4455;
      --text-main: #e8e8ff;
      --text-dim: #8888aa;
      --border: #2a2a5a;
      --border-bright: #4444aa;
    }

    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Courier New', monospace;
      font-size: 16px;
      overflow-x: hidden;
      image-rendering: pixelated;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0a0a1a 0%, #050518 50%, #0a0a1a 100%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: var(--bg-panel);
      border-right: 3px solid var(--border-bright);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border-bright);
    }

    .avatar {
      width: 60px;
      height: 60px;
      background: var(--bg-hover);
      border: 2px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border-radius: 0;
    }

    .user-info h2 {
      font-size: 18px;
      color: var(--accent-gold);
      margin-bottom: 5px;
    }

    .user-info p {
      font-size: 13px;
      color: var(--text-dim);
    }

    .nav-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
      font-size: 14px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text-main);
      border-left-color: var(--accent-gold);
    }

    .nav-item.active {
      background: var(--bg-hover);
      color: var(--accent-gold);
      border-left-color: var(--accent-gold);
      border: 2px solid var(--accent-gold);
    }

    .button {
      padding: 10px 20px;
      border: 2px solid var(--border-bright);
      background: var(--bg-hover);
      color: var(--text-main);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      margin-top: 10px;
      width: 100%;
    }

    .button:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .button-gold {
      background: var(--accent-gold);
      color: #000;
      border: 2px solid var(--accent-gold);
    }

    .button-gold:hover {
      background: #ffed4e;
    }

    .button-red {
      background: var(--accent-red);
      color: #fff;
      border: 2px solid var(--accent-red);
    }

    .button-red:hover {
      background: #ff6677;
    }

    .panel {
      background: var(--bg-panel);
      border: 3px solid var(--border-bright);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0 #000;
    }

    .panel h2 {
      font-size: 18px;
      color: var(--accent-gold);
      margin-bottom: 15px;
    }

    .panel h3 {
      font-size: 14px;
      color: var(--accent-blue);
      margin-bottom: 10px;
    }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      padding: 15px;
      margin-bottom: 10px;
    }

    .card:hover {
      border-color: var(--border-bright);
      transform: translateY(-2px);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 2px solid var(--border);
      padding: 15px;
      text-align: center;
    }

    .stat-box .value {
      font-size: 24px;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .stat-box .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 50%, #0a0a30 0%, #000010 70%);
      padding: 20px;
    }

    .login-box {
      background: var(--bg-panel);
      border: 3px solid var(--accent-gold);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), 8px 8px 0 #000;
    }

    .login-box h1 {
      text-align: center;
      color: var(--accent-gold);
      font-size: 24px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #ffd700;
    }

    .login-box .subtitle {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 30px;
      font-size: 12px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0a0a20;
      border: 2px solid var(--border-bright);
      color: var(--text-main);
      font-size: 14px;
      font-family: 'Courier New', monospace;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.3);
    }

    .credentials-hint {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--accent-gold);
      padding: 10px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .credentials-hint strong {
      color: var(--accent-gold);
    }

    .error {
      color: var(--accent-red);
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .loading {
      text-align: center;
      color: var(--accent-gold);
      font-size: 18px;
    }

    .hidden {
      display: none !important;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      color: var(--accent-gold);
    }

    table td {
      border: 1px solid var(--border);
      padding: 10px;
    }

    table tr:hover {
      background: var(--bg-card);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: var(--accent-blue);
      color: #000;
      font-size: 11px;
      margin-right: 5px;
      border: 1px solid var(--accent-blue);
    }

    .badge-gold {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .badge-green {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    .badge-red {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    .success-message {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 0;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide-in {
      animation: slideIn 0.3s ease-out;
    }

    .logout-btn {
      margin-top: auto;
    }

    .version {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-dim);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 3px solid var(--border-bright);
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ============================================================
    // SIMPLE APP - SIN REACT
    // ============================================================

    const app = {
      currentUser: null,
      users: [],
      view: 'dashboard',

      init() {
        console.log('🔧 Inicializando AMDEX...');
        this.loadData();
        this.setupEventListeners();
        this.checkSession();
      },

      loadData() {
        try {
          const stored = localStorage.getItem('amz_users');
          if (stored) {
            this.users = JSON.parse(stored);
            console.log('✅ Datos cargados desde localStorage');
          } else {
            this.initializeData();
          }
        } catch (e) {
          console.error('❌ Error cargando datos:', e);
          this.initializeData();
        }
      },

      initializeData() {
        this.users = [
          {
            id: 'admin_0',
            role: 'admin',
            username: 'adminamazonica',
            password: 'adminamazonica123',
            name: 'Administrador',
            emoji: '👑',
            level: 99,
            coins: 5000,
          },
        ];
        localStorage.setItem('amz_users', JSON.stringify(this.users));
        console.log('✅ Datos inicializados');
      },

      checkSession() {
        const sessionId = localStorage.getItem('amz_session');
        if (sessionId) {
          this.currentUser = this.users.find(u => u.id === sessionId);
          if (this.currentUser) {
            console.log('✅ Sesión restaurada:', this.currentUser.name);
            this.render();
            return;
          }
        }
        this.renderLogin();
      },

      setupEventListeners() {
        document.addEventListener('click', (e) => {
          if (e.target.matches('[data-action]')) {
            const action = e.target.getAttribute('data-action');
            const param = e.target.getAttribute('data-param');
            this[action]?.(param);
          }
        });
      },

      login(username, password) {
        const user = this.users.find(u => u.username === username && u.password === password);
        if (user) {
          this.currentUser = user;
          localStorage.setItem('amz_session', user.id);
          console.log('🔐 Login exitoso:', user.name);
          this.render();
        } else {
          console.error('❌ Credenciales inválidas');
          alert('❌ Usuario o contraseña incorrectos');
        }
      },

      logout() {
        localStorage.removeItem('amz_session');
        this.currentUser = null;
        this.renderLogin();
      },

      setView(view) {
        this.view = view;
        this.render();
      },

      renderLogin() {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="login-container">
            <div class="login-box slide-in">
              <h1>🏰 AMAZÓNICA RPG</h1>
              <p class="subtitle">Sistema de Recompensas Escolar</p>
              
              <div class="form-group">
                <label>USUARIO</label>
                <input type="text" id="username" placeholder="adminamazonica" value="adminamazonica">
              </div>

              <div class="form-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="password" placeholder="adminamazonica123" value="adminamazonica123">
              </div>

              <button class="button button-gold" onclick="app.login(
                document.getElementById('username').value,
                document.getElementById('password').value
              )">⚔️ ENTRAR AL MUNDO</button>

              <div class="credentials-hint">
                <strong>🔑 Credenciales de prueba:</strong><br>
                Usuario: <strong>adminamazonica</strong><br>
                Contraseña: <strong>adminamazonica123</strong>
              </div>
            </div>
          </div>
        `;
      },

      render() {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="container">
            <div class="sidebar">
              <div class="header">
                <div class="avatar">${this.currentUser.emoji}</div>
                <div class="user-info">
                  <h2>${this.currentUser.name}</h2>
                  <p>${this.currentUser.role === 'admin' ? 'ADMINISTRADOR' : 'USUARIO'}</p>
                </div>
              </div>

              <nav style="flex: 1;">
                <div class="nav-item ${this.view === 'dashboard' ? 'active' : ''}" 
                  data-action="setView" data-param="dashboard">
                  🏠 PANEL
                </div>
                <div class="nav-item ${this.view === 'users' ? 'active' : ''}" 
                  data-action="setView" data-param="users">
                  👥 USUARIOS
                </div>
                <div class="nav-item ${this.view === 'items' ? 'active' : ''}" 
                  data-action="setView" data-param="items">
                  🎒 TIENDA
                </div>
                <div class="nav-item ${this.view === 'ranking' ? 'active' : ''}" 
                  data-action="setView" data-param="ranking">
                  🏆 RANKING
                </div>
              </nav>

              <button class="button button-red logout-btn" data-action="logout">🚪 SALIR</button>
              <div class="version">v1.0 - AMDEX</div>
            </div>

            <div class="main-content">
              ${this.view === 'dashboard' ? this.renderDashboard() : ''}
              ${this.view === 'users' ? this.renderUsers() : ''}
              ${this.view === 'items' ? this.renderItems() : ''}
              ${this.view === 'ranking' ? this.renderRanking() : ''}
            </div>
          </div>
        `;
      },

      renderDashboard() {
        return `
          <div class="slide-in">
            <div class="panel">
              <h2>⚔️ BIENVENIDO AL PANEL ADMINISTRATIVO</h2>
              <div class="stat-grid">
                <div class="stat-box">
                  <div class="value">${this.users.length}</div>
                  <div class="label">USUARIOS TOTALES</div>
                </div>
                <div class="stat-box">
                  <div class="value">${this.currentUser.level}</div>
                  <div class="label">TU NIVEL</div>
                </div>
                <div class="stat-box">
                  <div class="value">${this.currentUser.coins}</div>
                  <div class="label">AMZ V DISPONIBLES</div>
                </div>
              </div>
            </div>

            <div class="panel">
              <h3>📊 INFORMACIÓN DEL SISTEMA</h3>
              <div class="card">
                <strong>✅ Sistema Inicializado Correctamente</strong>
                <p style="margin-top: 10px; font-size: 13px; color: var(--text-dim);">
                  AMDEX v1.0 está funcionando sin problemas. Todos los módulos están operativos.
                </p>
              </div>
              <div class="card" style="margin-top: 10px;">
                <strong>🎮 Características Disponibles</strong>
                <ul style="margin-top: 10px; font-size: 13px; color: var(--text-dim); padding-left: 20px;">
                  <li>✅ Gestión de usuarios</li>
                  <li>✅ Sistema de tienda</li>
                  <li>✅ Ranking global</li>
                  <li>✅ Persistencia en localStorage</li>
                  <li>✅ Panel administrativo</li>
                </ul>
              </div>
            </div>

            <div class="panel">
              <h3>🚀 Próximas Características</h3>
              <div class="card">
                <strong>En Desarrollo:</strong>
                <p style="margin-top: 10px; font-size: 13px; color: var(--text-dim);">
                  • Personajes RPG<br>
                  • Sistema de tareas<br>
                  • Validación de recompensas<br>
                  • Inventario de items<br>
                  • Sistema de mochilas
                </p>
              </div>
            </div>
          </div>
        `;
      },

      renderUsers() {
        return `
          <div class="slide-in">
            <div class="panel">
              <h2>👥 GESTIÓN DE USUARIOS</h2>
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>NOMBRE</th>
                    <th>USUARIO</th>
                    <th>ROL</th>
                    <th>NIVEL</th>
                  </tr>
                </thead>
                <tbody>
                  ${this.users.map(u => `
                    <tr>
                      <td>${u.emoji}</td>
                      <td>${u.name}</td>
                      <td>@${u.username}</td>
                      <td><span class="badge badge-gold">${u.role.toUpperCase()}</span></td>
                      <td>${u.level || 1}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderItems() {
        return `
          <div class="slide-in">
            <div class="panel">
              <h2>🛒 TIENDA DE ITEMS</h2>
              <div class="grid-3">
                <div class="card">
                  <strong>🍎 Manzana Mágica</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Restaura energía</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">5 AMZ V</p>
                </div>
                <div class="card">
                  <strong>🗡️ Espada Corta</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Arma básica</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">15 AMZ V</p>
                </div>
                <div class="card">
                  <strong>🛡️ Escudo Rústico</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Protección</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">12 AMZ V</p>
                </div>
                <div class="card">
                  <strong>📚 Tomo de Saberes</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Acceso biblioteca</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">20 AMZ V</p>
                </div>
                <div class="card">
                  <strong>🔮 Cristal de Visión</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Revela secretos</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">25 AMZ V</p>
                </div>
                <div class="card">
                  <strong>⚗️ Poción de XP</strong>
                  <p style="margin-top: 5px; font-size: 12px; color: var(--text-dim);">Doble XP 1h</p>
                  <p style="margin-top: 5px; color: var(--accent-gold);">30 AMZ V</p>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      renderRanking() {
        return `
          <div class="slide-in">
            <div class="panel">
              <h2>🏆 RANKING GLOBAL</h2>
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>NOMBRE</th>
                    <th>NIVEL</th>
                    <th>MONEDAS</th>
                  </tr>
                </thead>
                <tbody>
                  ${this.users
                    .sort((a, b) => (b.level || 0) - (a.level || 0))
                    .map((u, i) => `
                    <tr>
                      <td>${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}</td>
                      <td>${u.emoji} ${u.name}</td>
                      <td>${u.level || 1}</td>
                      <td>${u.coins || 0}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },
    };

    // Iniciar
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Página cargada, inicializando AMDEX...');
      app.init();
    });

    // Debugging
    console.log('%c✅ AMDEX v1.0 - Sistema de Recompensas Escolar', 'color: #ffd700; font-size: 16px; font-weight: bold;');
    console.log('%cPara iniciar: Abre esta página en tu navegador', 'color: #00ff88; font-size: 12px;');
  </script>
</body>
</html>
